#import "../fragments/coreBlocks.graphql"

query GetNodeByUri($uri: String!) {
  nodeByUri(uri: $uri) {
    __typename

    ... on Post {
      id
      title
      editorBlocks(flat: true) {
        __typename
        name
        ...CoreBlocksFragment
      }
    }

    ... on Work {
      id
      title
      editorBlocks(flat: true) {
        __typename
        name
        ...CoreBlocksFragment
      }
    }
  }
}
